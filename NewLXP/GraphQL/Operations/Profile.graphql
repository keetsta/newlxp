query GetMe {
  getMe {
    id
    email
    firstName
    lastName
    middleName
    avatar
    isLead
    student {
      id
      learningGroups {
        learningGroup {
          id
          name
          students {
            id
            firstName
            lastName
            middleName
            email
            avatar
          }
        }
      }
      studentSpecialties {
        specialtyId
        specialty {
          id
          name
          code
        }
      }
      suborganizations_V2 {
        suborganization {
          id
          name
        }
      }
    }
  }
}
